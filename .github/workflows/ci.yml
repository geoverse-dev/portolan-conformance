name: Test conformance harness
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: python -m pip install -e '.[test]'
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-selftest-report
          path: |
            report.json
            resource-resolution-report.json
            compatibility-report.json
