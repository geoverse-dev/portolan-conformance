name: External catalog observations

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  observe-released-sdks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Conformance
        uses: actions/checkout@v6

      - name: Check out portolan-python v1.0.0rc3
        uses: actions/checkout@v6
        with:
          repository: geoverse-dev/portolan-python
          ref: v1.0.0rc3
          path: .acceptance/portolan-python

      - name: Check out portolan-java v1.0.0-RC2
        uses: actions/checkout@v6
        with:
          repository: geoverse-dev/portolan-java
          ref: v1.0.0-RC2
          path: .acceptance/portolan-java

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Conformance and Python SDK
        run: |
          python -m pip install .
          uv sync --project .acceptance/portolan-python

      - name: Prepare Java adapter
        working-directory: .acceptance/portolan-java
        run: make prepare-conformance-adapter

      - name: Capture roots and observe with Python
        id: python-smoke
        shell: bash
        run: |
          status=0
          portolan-conformance smoke \
            --manifest external-catalogs/catalogs.json \
            --adapter 'uv run --project .acceptance/portolan-python python .acceptance/portolan-python/tests/conformance_adapter.py' \
            --observations external-observations \
            --report external-smoke-python.json || status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"

      - name: Observe the same roots with Java
        id: java-smoke
        shell: bash
        run: |
          status=0
          portolan-conformance smoke \
            --manifest external-catalogs/catalogs.json \
            --adapter '.acceptance/portolan-java/scripts/conformance-adapter' \
            --observations external-observations \
            --reuse-observations \
            --report external-smoke-java.json || status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"

      - name: Write job summary
        run: |
          {
            echo "## External catalog observations"
            echo
            echo "These are non-normative weekly observations."
            echo
            echo "- Python smoke exit: ${{ steps.python-smoke.outputs.exit_code }}"
            echo "- Java smoke exit: ${{ steps.java-smoke.outputs.exit_code }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload observations and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-catalog-observations
          path: |
            external-observations/
            external-smoke-python.json
            external-smoke-java.json
          if-no-files-found: warn
